<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>樂佩的魔法世界 V2.0</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #E0F7FA 0%, #FFF9C4 85%, #81C784 85%, #4CAF50 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        h1 {
            color: #9C27B0;
            font-size: 1.8em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #FFF;
        }

        .subtitle {
            color: #555;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
            max-width: 400px;
        }

        .option-btn {
            background-color: white;
            border: 3px solid #FF4081;
            color: #333;
            width: 130px;
            height: 110px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0px #E91E63;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #E91E63;
        }

        .option-icon { font-size: 2.5rem; margin-bottom: 5px; }
        .option-text { font-size: 1.1rem; font-weight: bold; color: #FF4081; }

        #back-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #fff;
            border: 2px solid #ccc;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            z-index: 50;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #stats-board {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1rem;
            color: #333;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 15px;
            border-radius: 15px;
            pointer-events: none;
            z-index: 50;
            font-weight: bold;
            display: flex;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .item {
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            padding: 10px;
            z-index: 10;
            touch-action: none;
        }

        .balloon-style {
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
        }

        .balloon-style::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 20%;
            width: 25%;
            height: 15%;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            transform: rotate(-45deg);
        }

        .emoji-style {
            font-size: 100%;
            line-height: 1;
            filter: drop-shadow(0px 4px 2px rgba(0,0,0,0.1));
        }

        .pop-effect {
            position: absolute;
            pointer-events: none;
            animation: popAnim 0.4s ease-out forwards;
            font-size: 2rem;
            font-weight: bold;
            color: #FF4081;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 2px 2px 0 #FFF;
            z-index: 20;
        }

        @keyframes popAnim {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }

        .miss-fruit {
            animation: squash 0.5s forwards;
            filter: grayscale(0.5);
            opacity: 0.7;
        }

        @keyframes squash {
            0% { transform: scale(1, 1); }
            50% { transform: scale(1.5, 0.5) translateY(10px); }
            100% { transform: scale(2, 0.1) translateY(20px); opacity: 0; }
        }

        .miss-animal {
            animation: hideInBush 0.5s forwards;
        }

        @keyframes hideInBush {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(20px) scale(0.8); opacity: 0; }
        }

        .miss-balloon {
            animation: floatAway 0.8s forwards;
        }

        @keyframes floatAway {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }

        .miss-vehicle {
            animation: driveOff 0.6s forwards;
        }

        @keyframes driveOff {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="menu-screen">
            <h1>🏰 樂佩的冒險 V2.0</h1>
            <p class="subtitle">更多朋友、更棒的聲音！</p>
            <div class="options-container">
                <button class="option-btn" onclick="startGame('balloon')">
                    <span class="option-icon">🎈</span>
                    <span class="option-text">氣球</span>
                </button>
                <button class="option-btn" onclick="startGame('fruit')">
                    <span class="option-icon">🍎</span>
                    <span class="option-text">水果</span>
                </button>
                <button class="option-btn" onclick="startGame('animal')">
                    <span class="option-icon">🦁</span>
                    <span class="option-text">動物園</span>
                </button>
                <button class="option-btn" onclick="startGame('vehicle')">
                    <span class="option-icon">🚂</span>
                    <span class="option-text">車車</span>
                </button>
            </div>
        </div>

        <button id="back-btn" onclick="goBack()">🏠 回選單</button>

        <div id="stats-board" style="display:none;">
            <div class="stat-item" style="color:#4CAF50;">
                <span>✨</span> <span id="score-val">0</span>
            </div>
            <div class="stat-item" style="color:#555;">
                <span>🔻</span> <span id="spawn-val">0</span>
            </div>
            <div class="stat-item" style="color:#FF5722;">
                <span>👋</span> <span id="miss-val">0</span>
            </div>
        </div>
    </div>

    <script>
        const gameData = {
            balloon: {
                type: 'color',
                missClass: 'miss-balloon',
                items: ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#54A0FF', '#FF9FF3', '#A3CB38'],
                popText: '✨'
            },
            fruit: {
                type: 'emoji',
                missClass: 'miss-fruit',
                items: ['🍎', '🍌', '🍇', '🍉', '🍓', '🍑', '🍍', '🥝', '🍒', '🥭', '🍐'],
                popText: 'Yum!'
            },
            animal: {
                type: 'sound_object',
                missClass: 'miss-animal',
                items: [
                    { emoji: '🐶', sound: 'dog' },
                    { emoji: '🐱', sound: 'cat' },
                    { emoji: '🦆', sound: 'duck' },
                    { emoji: '🐷', sound: 'pig' },
                    { emoji: '🐸', sound: 'frog' },
                    { emoji: '🦁', sound: 'lion' },
                    { emoji: '🐮', sound: 'cow' },
                    { emoji: '🐑', sound: 'sheep' },
                    { emoji: '🐵', sound: 'monkey' },
                    { emoji: '🐘', sound: 'elephant' }
                ],
                popText: '❤'
            },
            vehicle: {
                type: 'sound_object',
                missClass: 'miss-vehicle',
                items: [
                    { emoji: '🚗', sound: 'car' },
                    { emoji: '🚌', sound: 'car' },
                    { emoji: '🚕', sound: 'car' },
                    { emoji: '🚑', sound: 'siren' },
                    { emoji: '🚒', sound: 'siren' },
                    { emoji: '🚓', sound: 'siren' },
                    { emoji: '🚂', sound: 'train' },
                    { emoji: '✈️', sound: 'plane' },
                    { emoji: '🚀', sound: 'plane' },
                    { emoji: '🚲', sound: 'bike' }
                ],
                popText: 'Vroom!'
            }
        };

        let currentMode = null;
        let score = 0;
        let totalSpawn = 0;
        let missed = 0;
        let spawnInterval;
        let audioCtx;
        let noiseBuffer;

        const container = document.getElementById('game-container');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('back-btn');
        const statsBoard = document.getElementById('stats-board');
        const scoreVal = document.getElementById('score-val');
        const spawnVal = document.getElementById('spawn-val');
        const missVal = document.getElementById('miss-val');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function getNoiseBuffer() {
            if (!noiseBuffer) {
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }
            return noiseBuffer;
        }

        function playPopSound() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, t);
            osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        }

        function playAnimalSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'dog') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'cat') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(500, t + 0.2);
                osc.frequency.linearRampToValueAtTime(350, t + 0.5);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0.1, t + 0.4);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                osc.start(t); osc.stop(t + 0.5);
            } else if (type === 'duck') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(200, t + 0.15);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else if (type === 'cow') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.linearRampToValueAtTime(100, t + 0.6);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.6);
                osc.start(t); osc.stop(t + 0.6);
            } else if (type === 'sheep') {
                osc.type = 'sawtooth';
                const vibrato = audioCtx.createOscillator();
                const vGain = audioCtx.createGain();
                vibrato.frequency.value = 8;
                vGain.gain.value = 20;
                vibrato.connect(vGain);
                vGain.connect(osc.frequency);
                vibrato.start(t);

                osc.frequency.setValueAtTime(300, t);
                osc.frequency.linearRampToValueAtTime(250, t + 0.5);
                gain.gain.setValueAtTime(0.15, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.5);
                osc.start(t); osc.stop(t + 0.5); vibrato.stop(t + 0.5);
            } else if (type === 'lion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.4);

                const noise = audioCtx.createBufferSource();
                noise.buffer = getNoiseBuffer();
                const nGain = audioCtx.createGain();
                noise.connect(nGain);
                nGain.connect(audioCtx.destination);

                nGain.gain.setValueAtTime(0.3, t);
                nGain.gain.linearRampToValueAtTime(0, t + 0.4);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.4);

                osc.start(t); noise.start(t);
                osc.stop(t + 0.4); noise.stop(t + 0.4);
            } else if (type === 'monkey') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.linearRampToValueAtTime(600, t + 0.1);
                osc.frequency.linearRampToValueAtTime(400, t + 0.2);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.2);
                osc.start(t); osc.stop(t + 0.2);

                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.connect(g2); g2.connect(audioCtx.destination);
                osc2.frequency.setValueAtTime(400, t + 0.25);
                osc2.frequency.linearRampToValueAtTime(600, t + 0.35);
                g2.gain.setValueAtTime(0.1, t+0.25);
                g2.gain.linearRampToValueAtTime(0, t+0.45);
                osc2.start(t+0.25); osc2.stop(t+0.45);
            } else if (type === 'elephant') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(600, t);
                osc.frequency.linearRampToValueAtTime(800, t + 0.1);
                osc.frequency.linearRampToValueAtTime(300, t + 0.6);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.6);
                osc.start(t); osc.stop(t + 0.6);
            } else if (type === 'frog') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, t);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.15);
                osc.start(t); osc.stop(t + 0.15);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t);
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.linearRampToValueAtTime(0, t + 0.2);
                osc.start(t); osc.stop(t + 0.2);
            }
        }

        function playVehicleSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            if (type === 'car') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, t);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.setValueAtTime(0, t+0.1);
                gain.gain.setValueAtTime(0.1, t+0.15);
                gain.gain.setValueAtTime(0, t+0.25);
                osc.start(t); osc.stop(t+0.3);
            } else if (type === 'bike') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, t);
                gain.gain.setValueAtTime(0.1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t+0.2);
                osc.start(t); osc.stop(t+0.2);

                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.connect(g2); g2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(1200, t+0.25);
                g2.gain.setValueAtTime(0.1, t+0.25);
                g2.gain.exponentialRampToValueAtTime(0.01, t+0.45);
                osc2.start(t+0.25); osc2.stop(t+0.45);
            } else if (type === 'train') {
                const w1 = audioCtx.createOscillator(); w1.type='triangle';
                const w2 = audioCtx.createOscillator(); w2.type='triangle';
                const g = audioCtx.createGain();
                w1.connect(g); w2.connect(g); g.connect(audioCtx.destination);
                w1.frequency.value = 300; w2.frequency.value = 400;
                g.gain.setValueAtTime(0.1, t);
                g.gain.linearRampToValueAtTime(0, t+0.6);
                w1.start(t); w2.start(t);
                w1.stop(t+0.6); w2.stop(t+0.6);
            } else if (type === 'siren') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, t);
                osc.frequency.linearRampToValueAtTime(800, t+0.2);
                osc.frequency.linearRampToValueAtTime(600, t+0.4);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.linearRampToValueAtTime(0, t+0.5);
                osc.start(t); osc.stop(t+0.5);
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(200, t+0.6);
                gain.gain.setValueAtTime(0.05, t);
                gain.gain.linearRampToValueAtTime(0, t+0.6);
                osc.start(t); osc.stop(t+0.6);
            }
        }

        function updateStats() {
            scoreVal.innerText = score;
            spawnVal.innerText = totalSpawn;
            missVal.innerText = missed;
        }

        function startGame(mode) {
            initAudio();
            currentMode = mode;
            menuScreen.style.display = 'none';
            backBtn.style.display = 'block';
            statsBoard.style.display = 'flex';

            score = 0;
            totalSpawn = 0;
            missed = 0;
            updateStats();

            const oldItems = document.querySelectorAll('.item');
            oldItems.forEach(i => i.remove());

            createItem();
            spawnInterval = setInterval(createItem, 1500);
        }

        function goBack() {
            clearInterval(spawnInterval);
            menuScreen.style.display = 'flex';
            backBtn.style.display = 'none';
            statsBoard.style.display = 'none';
            const oldItems = document.querySelectorAll('.item');
            oldItems.forEach(i => i.remove());
        }

        function createItem() {
            if (menuScreen.style.display !== 'none') return;

            const item = document.createElement('div');
            item.classList.add('item');
            totalSpawn++;
            updateStats();

            const size = 70 + Math.random() * 40;
            item.style.width = `${size}px`;
            item.style.height = `${size}px`;

            const maxX = Math.max(0, window.innerWidth - size);
            const startX = Math.random() * maxX;
            item.style.left = `${startX}px`;
            item.style.top = `-${size}px`;

            const modeData = gameData[currentMode];
            let content;
            let soundType = 'default';
            let isMissed = false;

            if (modeData.type === 'color') {
                content = modeData.items[Math.floor(Math.random() * modeData.items.length)];
                item.style.backgroundColor = content;
                item.classList.add('balloon-style');
            } else if (modeData.type === 'emoji') {
                content = modeData.items[Math.floor(Math.random() * modeData.items.length)];
                item.innerText = content;
                item.classList.add('emoji-style');
                item.style.fontSize = `${size * 0.8}px`;
            } else if (modeData.type === 'sound_object') {
                const choice = modeData.items[Math.floor(Math.random() * modeData.items.length)];
                content = choice.emoji;
                soundType = choice.sound;
                item.innerText = content;
                item.classList.add('emoji-style');
                item.style.fontSize = `${size * 0.8}px`;
            }

            const duration = 4000 + Math.random() * 3000;
            const endY = window.innerHeight - size - 20;
            const animation = item.animate([
                { transform: 'translateY(0px) rotate(0deg)' },
                { transform: `translateY(${window.innerHeight}px) rotate(${currentMode === 'vehicle' ? 0 : (Math.random() * 60 - 30)}deg)` }
            ], {
                duration: duration,
                easing: 'linear'
            });

            animation.onfinish = () => {
                if (!item.parentElement) return;

                isMissed = true;
                missed++;
                updateStats();

                animation.cancel();
                item.style.top = `${endY}px`;
                item.classList.add(modeData.missClass);

                setTimeout(() => {
                    if (item.parentElement) item.remove();
                }, 800);
            };

            const handleInteract = (e) => {
                if (isMissed) return;
                e.preventDefault();
                e.stopPropagation();

                if (currentMode === 'animal') {
                    playAnimalSound(soundType);
                } else if (currentMode === 'vehicle') {
                    playVehicleSound(soundType);
                } else {
                    playPopSound();
                }

                const rect = item.getBoundingClientRect();
                showPopText(rect.left, rect.top, size, modeData.popText);

                score++;
                updateStats();

                item.remove();
                animation.cancel();
            };

            item.addEventListener('pointerdown', handleInteract);
            container.appendChild(item);
        }

        function showPopText(x, y, size, text) {
            const pop = document.createElement('div');
            pop.innerText = text;
            pop.classList.add('pop-effect');
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;
            pop.style.width = `${size}px`;
            pop.style.height = `${size}px`;
            container.appendChild(pop);
            setTimeout(() => pop.remove(), 400);
        }

        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
